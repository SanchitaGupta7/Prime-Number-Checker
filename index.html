<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Number Checker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="topic"><p>Prime Number Checker</p></div>
        <div class="number"><input type="number" value="" placeholder="Enter the number you want to check"></div>
        <div class="buttons">
            <button id="clearButton"> Clear </button>
            <button id="submitButton"> Submit </button>
        </div>
        <div class="resultBox"><p>Result</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
